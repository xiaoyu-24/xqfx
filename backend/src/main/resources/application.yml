spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/requirements_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:requirements_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

app:
  attachments:
    root-directory: ${ATTACHMENTS_ROOT:./uploads}
    minimum-free-space-bytes: ${ATTACHMENTS_MINIMUM_FREE_SPACE_BYTES:0}
