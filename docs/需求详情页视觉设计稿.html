<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求详情页视觉设计稿</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --primary-light: #e6f4ff;
      --text-1: #262626;
      --text-2: #595959;
      --text-3: #8c8c8c;
      --border: #f0f0f0;
      --border-strong: #e8e8e8;
      --bg-page: #f5f7fa;
      --warning-bg: #fff7e6;
      --warning-text: #d46b08;
      --warning-border: #ffd591;
      --radius: 10px;
      --shadow-card: 0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.04);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      color: var(--text-1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1080px; background: var(--bg-page); }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── 顶部导航 ───────────────────────────── */
    .topbar {
      height: 60px; display: flex; align-items: center; padding: 0 28px;
      background: #fff; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: .5px; }
    .brand-mark {
      width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 8px; color: #fff; font-size: 16px;
      background: linear-gradient(135deg, #1677ff, #69b1ff);
      box-shadow: 0 2px 6px rgba(22,119,255,.3);
    }
    .search {
      width: 340px; height: 34px; margin-left: auto; display: flex; align-items: center;
      border: 1px solid var(--border-strong); border-radius: 17px; background: #fafafa;
      color: var(--text-3); transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .search:hover, .search:focus-within { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }
    .search span { padding: 0 14px; flex: 1; font-size: 13px; }
    .search i { width: 38px; height: 32px; display: grid; place-items: center; font-style: normal; font-size: 15px; color: var(--text-3); }
    .user { display: flex; align-items: center; gap: 10px; margin-left: 26px; padding-left: 22px; border-left: 1px solid var(--border); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(135deg, #1677ff, #91caff); color: #fff; font-size: 13px; font-weight: 600;
    }
    .user-meta { display: flex; flex-direction: column; line-height: 1.3; }
    .user-meta strong { font-size: 13px; }
    .user-meta em { color: var(--text-3); font-size: 11px; font-style: normal; }
    .logout { margin-left: 18px; color: var(--text-2); font-size: 13px; cursor: pointer; }
    .logout:hover { color: var(--primary); }

    /* ── 布局与侧边栏 ────────────────────────── */
    .layout { flex: 1; display: flex; }
    .sidebar { width: 216px; flex-shrink: 0; padding: 16px 12px; background: #fff; border-right: 1px solid var(--border); }
    .nav-item {
      height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
      margin-bottom: 4px; border-radius: 8px; color: var(--text-2); font-size: 14px;
      transition: background .15s, color .15s; cursor: pointer;
    }
    .nav-item:hover { background: #f5f5f5; color: var(--text-1); }
    .nav-item.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
    .nav-icon { width: 18px; text-align: center; color: var(--text-3); font-size: 15px; }
    .nav-item.active .nav-icon { color: var(--primary); }

    /* ── 主内容区 ────────────────────────────── */
    main { flex: 1; min-width: 0; padding: 24px 32px 48px; }

    /* 面包屑 + 页头 */
    .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--text-3); font-size: 13px; }
    .breadcrumb .link { color: var(--text-2); cursor: pointer; }
    .breadcrumb .link:hover { color: var(--primary); }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .page-title { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .page-title .req-id { font-size: 13px; font-weight: 500; color: var(--text-3); padding: 2px 8px; background: #fff; border: 1px solid var(--border); border-radius: 6px; }
    .actions { display: flex; flex-shrink: 0; gap: 10px; }
    .btn {
      height: 34px; padding: 0 16px; border: 1px solid #d9d9d9; border-radius: 8px;
      background: #fff; color: var(--text-1); font-size: 14px;
      transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(22,119,255,.25); }
    .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn.small { height: 30px; padding: 0 12px; font-size: 13px; }

    /* ── 主卡片 ─────────────────────────────── */
    .surface { border-radius: var(--radius); background: #fff; box-shadow: var(--shadow-card); overflow: hidden; }

    /* 标题横幅区 */
    .hero {
      padding: 26px 32px 22px;
      background: linear-gradient(180deg, #f7faff 0%, #fff 100%);
      border-bottom: 1px solid var(--border);
    }
    .hero .label { display: block; margin-bottom: 6px; color: var(--text-3); font-size: 12px; letter-spacing: .5px; }
    .hero-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .requirement-title { color: var(--text-1); font-size: 18px; line-height: 1.5; font-weight: 700; word-break: break-word; }
    .hero-meta { display: flex; align-items: center; gap: 16px; margin-top: 14px; color: var(--text-3); font-size: 13px; flex-wrap: wrap; }
    .hero-meta .meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .hero-meta .meta-item b { color: var(--text-2); font-weight: 500; }

    /* 标签 */
    .tag {
      display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px;
      border: 1px solid var(--border-strong); border-radius: 12px; background: #fafafa;
      color: var(--text-2); font-size: 12px; font-weight: 500;
    }
    .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .tag.blue { border-color: #91caff; background: var(--primary-light); color: var(--primary); }
    .tag.warning { border-color: var(--warning-border); background: var(--warning-bg); color: var(--warning-text); }
    .tag.orange { border-color: var(--warning-border); background: var(--warning-bg); color: var(--warning-text); }

    /* 信息栅格 */
    .info-section { padding: 22px 32px 8px; }
    .info-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px 32px;
    }
    .info-item { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; border-radius: 8px; background: #fafbfc; border: 1px solid #f3f5f7; min-width: 0; }
    .info-item .label { flex-shrink: 0; width: 76px; color: var(--text-3); font-size: 13px; }
    .info-item .value { min-width: 0; color: var(--text-1); font-weight: 500; word-break: break-word; }

    /* 分区标题 */
    .section { padding: 24px 32px; border-top: 1px solid var(--border); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-title { margin: 0; font-size: 15px; line-height: 1.5; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--primary); }

    /* 需求内容 */
    .content-box {
      min-height: 150px; padding: 20px 22px;
      border: 1px solid var(--border-strong); border-radius: 10px;
      background: linear-gradient(180deg, #fafbfc, #fff);
    }
    .content-box p { margin: 0; color: #434343; line-height: 1.9; white-space: pre-wrap; }
    .content-box .placeholder { color: var(--text-3); }

    /* 进展记录（时间线） */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--border); border-radius: 1px; }
    .timeline-item { position: relative; padding: 0 0 22px; }
    .timeline-item:last-child { padding-bottom: 4px; }
    .timeline-item::before {
      content: ""; position: absolute; left: -24px; top: 6px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #fff; border: 2px solid var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .timeline-item.gray::before { border-color: #d9d9d9; box-shadow: 0 0 0 3px #f5f5f5; }
    .timeline-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .timeline-head strong { font-size: 14px; }
    .timeline-time { color: var(--text-3); font-size: 12px; }
    .timeline-body { margin-top: 6px; color: var(--text-2); font-size: 13px; line-height: 1.7; }
    .empty {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 28px 0; color: var(--text-3); font-size: 13px;
    }
    .empty .empty-icon { font-size: 26px; opacity: .5; }

    /* 附件 */
    .attachment {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px;
      background: #fafbfc; transition: border-color .2s, background .2s; cursor: pointer;
    }
    .attachment:hover { border-color: #91caff; background: var(--primary-light); }
    .attachment .file-icon {
      width: 32px; height: 32px; display: grid; place-items: center; flex-shrink: 0;
      border-radius: 8px; background: var(--primary-light); color: var(--primary); font-size: 15px;
    }
    .attachment .file-name { flex: 1; min-width: 0; color: var(--text-1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment .file-size { color: var(--text-3); font-size: 12px; }
    .attachment .file-action { color: var(--primary); font-size: 13px; }

    .link { color: var(--primary); cursor: pointer; }
    .link:hover { color: var(--primary-hover); }
    .muted { color: var(--text-3); }

    @media (max-width: 900px) {
      body { min-width: 0; }
      .sidebar { width: 188px; }
      main { padding: 20px; }
      .hero, .info-section, .section { padding-left: 22px; padding-right: 22px; }
      .info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search { width: 240px; }
    }
    @media (max-width: 680px) {
      .topbar { padding: 0 16px; }
      .search, .user-meta em { display: none; }
      .user { margin-left: auto; }
      .sidebar { display: none; }
      .page-header { flex-direction: column; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; justify-content: center; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">▦</span><span>需求分析平台</span></div>
      <div class="search"><span>搜索需求</span><i>⌕</i></div>
      <div class="user">
        <span class="avatar">管</span>
        <span class="user-meta"><strong>系统管理员</strong><em>管理员</em></span>
      </div>
      <span class="logout">↪ 退出</span>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="nav-item"><span class="nav-icon">◉</span><span>待办工作台</span></div>
        <div class="nav-item"><span class="nav-icon">▤</span><span>填写需求</span></div>
        <div class="nav-item active"><span class="nav-icon">☷</span><span>需求列表</span></div>
        <div class="nav-item"><span class="nav-icon">⚙</span><span>系统管理</span></div>
        <div class="nav-item"><span class="nav-icon">◇</span><span>版本管理</span></div>
        <div class="nav-item"><span class="nav-icon">♧</span><span>人员管理</span></div>
        <div class="nav-item"><span class="nav-icon">▣</span><span>字典管理</span></div>
        <div class="nav-item"><span class="nav-icon">▤</span><span>AI 配置</span></div>
      </aside>
      <main>
        <div class="breadcrumb">
          <span class="link">需求列表</span>
          <span>/</span>
          <span>需求详情</span>
        </div>
        <div class="page-header">
          <h1 class="page-title">需求详情 <span class="req-id">#REQ-20260807</span></h1>
          <div class="actions">
            <button class="btn">← 返回列表</button>
            <button class="btn primary">✎ 编辑需求</button>
          </div>
        </div>
        <article class="surface">
          <!-- 标题横幅 -->
          <section class="hero">
            <span class="label">需求标题</span>
            <div class="hero-title-row">
              <strong class="requirement-title">WWWW</strong>
              <span class="tag blue"><span class="dot"></span>需求</span>
              <span class="tag warning"><span class="dot"></span>待评估</span>
              <span class="tag orange">紧急度：中</span>
            </div>
            <div class="hero-meta">
              <span class="meta-item">所属系统 <b>cs</b></span>
              <span class="meta-item">负责人 <b>系统负责人</b></span>
              <span class="meta-item">目标版本 <b>1.002</b></span>
              <span class="meta-item">填写人 <b>xiao / IT部</b></span>
              <span class="meta-item">填写时间 <b>2026-08-07</b></span>
            </div>
          </section>

          <!-- 详细信息 -->
          <section class="info-section">
            <div class="info-grid">
              <div class="info-item"><span class="label">需求周期</span><span class="value muted">—</span></div>
              <div class="info-item"><span class="label">最后修改</span><span class="value">2026-08-07</span></div>
            </div>
          </section>

          <!-- 需求内容 -->
          <section class="section">
            <div class="section-head"><h3 class="section-title">需求内容</h3></div>
            <div class="content-box"><p>wddqwd</p></div>
          </section>

          <!-- 进展记录 -->
          <section class="section">
            <div class="section-head">
              <h3 class="section-title">进展记录</h3>
              <button class="btn primary small">＋ 更新进度</button>
            </div>
            <div class="empty">
              <span class="empty-icon">◌</span>
              <span>暂无进展记录，点击「更新进度」添加第一条</span>
            </div>
            <!-- 有数据时的示意（设计稿参考）：
            <div class="timeline">
              <div class="timeline-item">
                <div class="timeline-head"><strong>状态更新为「开发中」</strong><span class="timeline-time">2026-08-08 10:24 · xiao</span></div>
                <div class="timeline-body">需求评审通过，进入开发阶段。</div>
              </div>
              <div class="timeline-item gray">
                <div class="timeline-head"><strong>创建需求</strong><span class="timeline-time">2026-08-07 16:02 · xiao</span></div>
              </div>
            </div>
            -->
          </section>

          <!-- 附件 -->
          <section class="section">
            <div class="section-head">
              <h3 class="section-title">附件</h3>
              <button class="btn small">⇪ 上传附件</button>
            </div>
            <div class="empty">
              <span class="empty-icon">▢</span>
              <span>暂无附件</span>
            </div>
            <!-- 有数据时的示意（设计稿参考）：
            <div class="attachment">
              <span class="file-icon">▤</span>
              <span class="file-name">需求说明书.pdf</span>
              <span class="file-size">2.4 MB</span>
              <span class="file-action">下载</span>
            </div>
            -->
          </section>
        </article>
      </main>
    </div>
  </div>
</body>
</html>
